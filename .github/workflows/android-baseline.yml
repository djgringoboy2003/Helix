name: Android baseline

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Regression tests
        run: npm run test:regressions

      # `android/app/build.gradle` applies the Google Services plugin
      # unconditionally, so Gradle cannot run at all without this file. It is
      # gitignored, which means a fork without the secret configured can only
      # run the checks above — that is reported and skipped rather than failed,
      # so a missing secret does not look like broken code.
      - name: Decode Firebase Android config
        id: firebase
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_CONFIG_B64 }}
        run: |
          if [ -z "$FIREBASE_CONFIG_B64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_CONFIG_B64 is not configured, so the Android build was skipped. TypeScript and regression checks still ran."
          else
            printf '%s' "$FIREBASE_CONFIG_B64" | base64 -d > android/app/google-services.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        if: steps.firebase.outputs.available == 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: steps.firebase.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
